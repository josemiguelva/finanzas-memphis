name: Guardia de datos
on: [push, pull_request]
permissions:
  contents: read
jobs:
  guardia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar que no se suban datos personales
        env:
          GUARDIA_TERMINOS: ${{ secrets.GUARDIA_TERMINOS }}
        run: bash tools/guardia.sh
